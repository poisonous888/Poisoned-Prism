name: build zip
on: [ pull_request, push ]

env:
  NAME: poisoned-prism
  VERSION: 0.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: cull unused files
        run: |
          rm -r .git/ ".github/" .gitignore README.md "assets/psnprsm/textures/rem_item" "assets/minecraft/optifine/sky" "assets/minecraft/textures/rem"
          find assets -name index*.txt -delete

      - name: create full zip
        run: |
          zip -r ${{ env.NAME }}-FULL-${{ env.VERSION }}.zip . -i pack.png pack.mcmeta "assets/*"

      - name: capture full zip
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            ${{ env.NAME }}-FULL-${{ env.VERSION }}.zip
          archive: false

      - name: create CIT zip
        run: |
          rm "pack.png"
          mv "sword.png" "pack.png"
          zip -r ${{ env.NAME }}-CIT-${{ env.VERSION }}.zip . -i pack.png pack.mcmeta "assets/psnprsm/*" "assets/hypixel_skyblock/*" assets/minecraft/items/* assets/minecraft/models/item/*

      - name: capture CIT zip
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            ${{ env.NAME }}-CIT-${{ env.VERSION }}.zip
          archive: false

      - name: create SFX zip
        run: |
          rm "pack.png"
          mv "sfx.png" "pack.png"
          zip -r ${{ env.NAME }}-SFX-${{ env.VERSION }}.zip . -i pack.png pack.mcmeta assets/minecraft/sounds.json "assets/minecraft/sounds/*"

      - name: capture SFX zip
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            ${{ env.NAME }}-SFX-${{ env.VERSION }}.zip
          archive: false